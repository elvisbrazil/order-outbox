spring:
  application:
    name: order-outbox
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true

outbox:
  topic: orders.events
  batch-size: 100
  send-timeout: 5s
  relay:
    interval-ms: 500
